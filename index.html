<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" id="theme-color" content="#f4f1e9">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Daymark — Time Tracker</title>
  <script>
    (() => {
      const savedTheme = document.cookie.match(/(?:^|;\s*)daymark-theme=(light|dark)(?:;|$)/)?.[1];
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17231e;
      --muted: #69746f;
      --paper: #f4f1e9;
      --card: #fffdf8;
      --surface: #ffffff;
      --line: #d8d5cb;
      --green: #28664a;
      --green-dark: #1d4b37;
      --action: #28664a;
      --mint: #dcecdf;
      --orange: #df7139;
      --card-border: rgba(23, 35, 30, .08);
      --tabs-bg: rgba(255, 253, 248, .62);
      --focus-ring: rgba(40, 102, 74, .12);
      --danger: #a8392f;
      --danger-line: #d7aaa5;
      --shadow: 0 24px 60px rgba(25, 45, 35, .12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #edf4f0;
      --muted: #a7b6ae;
      --paper: #101712;
      --card: #18231d;
      --surface: #111a15;
      --line: #35453c;
      --green: #337d5c;
      --green-dark: #286449;
      --action: #80c9a0;
      --mint: #dcecdf;
      --orange: #f09a67;
      --card-border: rgba(220, 236, 223, .09);
      --tabs-bg: rgba(24, 35, 29, .66);
      --focus-ring: rgba(98, 185, 137, .22);
      --danger: #f29a91;
      --danger-line: #8d554f;
      --shadow: 0 24px 60px rgba(0, 0, 0, .32);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --ink: #edf4f0;
        --muted: #a7b6ae;
        --paper: #101712;
        --card: #18231d;
        --surface: #111a15;
        --line: #35453c;
        --green: #337d5c;
        --green-dark: #286449;
        --action: #80c9a0;
        --mint: #dcecdf;
        --orange: #f09a67;
        --card-border: rgba(220, 236, 223, .09);
        --tabs-bg: rgba(24, 35, 29, .66);
        --focus-ring: rgba(98, 185, 137, .22);
        --danger: #f29a91;
        --danger-line: #8d554f;
        --shadow: 0 24px 60px rgba(0, 0, 0, .32);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(223, 113, 57, .10), transparent 24rem),
        radial-gradient(circle at 88% 88%, rgba(40, 102, 74, .10), transparent 27rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell { width: min(1000px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 40px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.03em; }
    .mark { display: block; width: 36px; height: 36px; border-radius: 9px; }
    .today { color: var(--muted); font-size: .9rem; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .theme-select { min-height: 36px; border: 1px solid var(--line); border-radius: 10px; padding: 0 28px 0 10px; background-color: var(--card); color: var(--ink); font: inherit; font-size: .78rem; font-weight: 750; cursor: pointer; outline: none; }
    .theme-select:focus-visible { border-color: var(--green); box-shadow: 0 0 0 3px var(--focus-ring); }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 14px; padding: 4px; border: 1px solid var(--card-border); border-radius: 14px; background: var(--tabs-bg); }
    .tab { min-height: 44px; border-radius: 10px; background: transparent; color: var(--muted); font-size: .88rem; font-weight: 800; transition: color .18s, background .18s, box-shadow .18s; }
    .tab[aria-selected="true"] { color: var(--ink); background: var(--card); box-shadow: 0 4px 14px rgba(25, 45, 35, .09); }
    .tab:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .tab-panel[hidden] { display: none; }

    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, .65fr); gap: 18px; align-items: stretch; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 24px; box-shadow: var(--shadow); }
    .entry { padding: clamp(24px, 4vw, 34px); }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 500; letter-spacing: -.045em; line-height: 1; }
    .intro { margin: 8px 0 24px; color: var(--muted); font-size: .94rem; }

    .time-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .time-grid > * { min-width: 0; }
    label { display: block; margin: 0 0 7px; color: var(--muted); font-size: .78rem; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
    input[type="time"], input[type="number"] { width: 100%; height: 50px; min-height: 50px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; color: var(--ink); font: inherit; font-size: 1rem; line-height: 1; outline: none; transition: border-color .18s, box-shadow .18s; }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--focus-ring); }
    input[aria-invalid="true"] { border-color: var(--danger); }

    .divider { height: 1px; margin: 20px 0; background: var(--line); }
    .break-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; font-weight: 600; }
    .break-row { display: grid; grid-template-columns: 1fr 42px; align-items: end; gap: 8px; margin-top: 10px; }
    .break-row.fixed-break { grid-template-columns: 1fr; }
    button { border: 0; font: inherit; cursor: pointer; }
    .add-break { min-height: 40px; padding: 0 10px; border-radius: 10px; color: var(--action); background: transparent; font-size: .85rem; font-weight: 750; }
    .remove-break { height: 50px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--muted); font-size: 1.25rem; }
    .remove-break:hover { color: var(--danger); border-color: var(--danger-line); }
    .calculate { width: 100%; margin-top: 18px; min-height: 50px; border-radius: 14px; background: var(--green); color: white; font-weight: 800; box-shadow: 0 10px 25px rgba(40, 102, 74, .2); transition: background .18s, transform .18s; }
    .calculate:hover { background: var(--green-dark); transform: translateY(-1px); }
    .add-break:focus-visible, .remove-break:focus-visible, .calculate:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

    .result { padding: 28px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; background: var(--green); color: white; }
    .result > div:first-child { min-width: 0; }
    .result::after { content: ""; position: absolute; width: 210px; height: 210px; right: -100px; bottom: -90px; border: 36px solid rgba(255,255,255,.07); border-radius: 50%; }
    .result-label { color: rgba(255,255,255,.72); font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .result-value { margin: 24px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3.5rem, 8vw, 5rem); font-variant-numeric: tabular-nums; line-height: .85; letter-spacing: -.06em; }
    .result-value.clock-value { font-size: clamp(2.5rem, 4vw, 3.25rem); letter-spacing: -.075em; white-space: nowrap; }
    .result-unit { margin: 12px 0 0 5px; color: var(--mint); font-size: .95rem; }
    .result[data-state="invalid"] .result-unit { visibility: hidden; }
    .summary { position: relative; z-index: 1; margin-top: 44px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.22); color: rgba(255,255,255,.78); font-size: .9rem; line-height: 1.55; }
    .error { min-height: 22px; margin: 12px 0 -10px; color: var(--danger); font-size: .88rem; }
    .error:empty { display: none; }

    @media (max-width: 860px) {
      .shell { width: min(100% - 28px, 820px); padding: 24px 0 28px; }
      main { grid-template-columns: 1fr; gap: 14px; }
      .result { min-height: 150px; flex-direction: row; align-items: center; gap: 24px; }
      .result > div:first-child { flex: 1 1 auto; min-width: 0; }
      .result-value { display: inline; margin: 0; font-size: 4rem; }
      .result-value.clock-value { display: block; font-size: clamp(2.4rem, 7vw, 3.25rem); }
      .result-unit { display: inline; margin: 0 0 0 7px; }
      .summary { flex: 0 1 240px; min-width: 0; max-width: 240px; margin: 0; padding: 0 0 0 24px; border-top: 0; border-left: 1px solid rgba(255,255,255,.22); }
    }

    @media (max-width: 720px) {
      .shell { width: min(100% - 20px, 680px); padding: 10px 0 16px; }
      header { margin-bottom: 10px; }
      .tabs { margin-bottom: 10px; }
      .tab { min-height: 40px; font-size: .8rem; }
      .mark { width: 32px; height: 32px; }
      .brand { gap: 9px; }
      .today { font-size: .78rem; }
      .header-actions { gap: 8px; }
      .theme-select { min-height: 34px; padding-left: 8px; font-size: .74rem; }
      main { grid-template-columns: 1fr; gap: 10px; }
      .card { border-radius: 18px; box-shadow: var(--shadow); }
      .entry { padding: 18px; }
      h1 { font-size: 1.75rem; }
      .intro { margin: 4px 0 16px; font-size: .84rem; }
      label { margin-bottom: 5px; font-size: .72rem; }
      input[type="time"], input[type="number"] { height: 44px; min-height: 44px; padding: 0 10px; line-height: 1; }
      .divider { margin: 14px 0; }
      .break-heading { margin-bottom: 6px; }
      h2 { font-size: 1.08rem; }
      .break-row { grid-template-columns: 1fr 40px; margin-top: 7px; }
      .break-row.fixed-break { grid-template-columns: 1fr; }
      .add-break { min-height: 40px; }
      .remove-break { height: 44px; }
      .error { min-height: 17px; margin: 6px 0 -6px; font-size: .78rem; }
      .calculate { min-height: 46px; margin-top: 12px; }
      .result { min-height: 112px; padding: 17px 20px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 16px; }
      .result > div:first-child { flex: 1 1 auto; min-width: 0; }
      .result-value { display: inline; margin: 0; font-size: 3.4rem; }
      .result-value.clock-value { display: block; font-size: clamp(1.6rem, 8vw, 2.75rem); letter-spacing: -.075em; }
      .result-unit { display: inline; margin: 0 0 0 7px; font-size: .78rem; }
      .summary { min-width: 0; margin: 0; padding: 0 0 0 16px; border-top: 0; border-left: 1px solid rgba(255,255,255,.22); max-width: none; overflow-wrap: anywhere; font-size: .78rem; }
    }

    @media (max-width: 560px) {
      .today { display: none; }
    }

    @media (max-width: 380px) {
      .entry { padding: 15px; }
      .result { min-height: 102px; padding: 14px 17px; gap: 10px; }
      .result-value { font-size: 3rem; }
      .summary { padding-left: 12px; font-size: .76rem; }
    }

    @media (max-width: 720px) and (max-height: 700px) {
      .shell { padding-top: 6px; padding-bottom: 10px; }
      header { margin-bottom: 6px; }
      .tabs { margin-bottom: 6px; }
      .entry { padding-top: 15px; padding-bottom: 15px; }
      .intro { margin-bottom: 12px; }
      .divider { margin: 10px 0; }
      .break-heading { margin-bottom: 2px; }
      .break-row { margin-top: 4px; }
      .error { min-height: 14px; margin-top: 3px; margin-bottom: -5px; }
      .calculate { min-height: 44px; margin-top: 8px; }
      .result { min-height: 96px; padding-top: 12px; padding-bottom: 12px; }
    }

    @media (max-width: 720px) and (max-height: 540px) {
      .shell { padding-bottom: 6px; }
      main { gap: 8px; }
      .entry { padding-top: 12px; padding-bottom: 12px; }
      h1 { margin-bottom: 8px; }
      .intro { display: none; }
      .divider { margin: 7px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      input, button { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><img class="mark" src="favicon.svg" alt=""> Daymark</div>
      <div class="header-actions">
        <div class="today" id="today"></div>
        <label class="sr-only" for="theme-select">Color theme</label>
        <select class="theme-select" id="theme-select" aria-label="Color theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Time calculators">
      <button class="tab" id="hours-tab" type="button" role="tab" aria-selected="true" aria-controls="hours-panel">Hours worked</button>
      <button class="tab" id="stop-tab" type="button" role="tab" aria-selected="false" aria-controls="stop-panel" tabindex="-1">Stop time</button>
    </nav>

    <main class="tab-panel" id="hours-panel" role="tabpanel" aria-labelledby="hours-tab">
      <section class="card entry">
        <h1>Today’s hours</h1>
        <p class="intro">Enter your shift and breaks.</p>

        <form id="tracker-form" novalidate>
          <div class="time-grid">
            <div><label for="start">Start time</label><input id="start" type="time" value="08:00" required></div>
            <div><label for="end">End time</label><input id="end" type="time" value="16:30" required></div>
          </div>

          <div class="divider"></div>
          <div class="break-heading">
            <h2>Breaks</h2>
            <button class="add-break" type="button" id="add-break">+ Add break</button>
          </div>
          <div id="breaks">
            <div class="break-row fixed-break">
              <div><label for="lunch">Lunch (minutes)</label><input class="break-minutes" id="lunch" type="number" min="0" max="1440" step="1" inputmode="numeric" value="30" required></div>
            </div>
          </div>
          <p class="error" id="error"></p>
          <button class="calculate" type="submit">Calculate hours</button>
        </form>
      </section>

      <aside class="card result">
        <div>
          <div class="result-label">Hours worked</div>
          <div class="result-value" id="hours"></div>
          <div class="result-unit">hours</div>
        </div>
        <div class="summary" id="summary"></div>
      </aside>
      <p class="sr-only" id="hours-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>

    <main class="tab-panel" id="stop-panel" role="tabpanel" aria-labelledby="stop-tab" hidden>
      <section class="card entry">
        <h1>Clock-out time</h1>
        <p class="intro">See when you’ll hit your goal.</p>

        <form id="stop-form" novalidate>
          <div class="time-grid">
            <div><label for="stop-start">Start time</label><input id="stop-start" type="time" value="08:00" required></div>
            <div><label for="desired-hours">Desired hours</label><input id="desired-hours" type="number" min="0.1" max="24" step="0.1" inputmode="decimal" value="8" required></div>
          </div>

          <div class="divider"></div>
          <div class="break-heading">
            <h2>Breaks</h2>
            <button class="add-break" type="button" id="add-stop-break">+ Add break</button>
          </div>
          <div id="stop-breaks">
            <div class="break-row fixed-break">
              <div><label for="stop-lunch">Lunch (minutes)</label><input class="break-minutes" id="stop-lunch" type="number" min="0" max="1440" step="1" inputmode="numeric" value="30" required></div>
            </div>
          </div>
          <p class="error" id="stop-error"></p>
          <button class="calculate" type="submit">Calculate stop time</button>
        </form>
      </section>

      <aside class="card result">
        <div>
          <div class="result-label">Stop time</div>
          <div class="result-value clock-value" id="stop-time"></div>
        </div>
        <div class="summary" id="stop-summary"></div>
      </aside>
      <p class="sr-only" id="stop-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </div>

  <script>
    document.querySelector('#today').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());

    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    const themeSelect = document.querySelector('#theme-select');
    const themeColor = document.querySelector('#theme-color');

    function activeTheme() {
      return document.documentElement.dataset.theme || (themeMedia.matches ? 'dark' : 'light');
    }

    function updateThemeColor() {
      themeColor.content = activeTheme() === 'dark' ? '#101712' : '#f4f1e9';
    }

    themeSelect.value = document.documentElement.dataset.theme || 'system';
    themeSelect.addEventListener('change', () => {
      if (themeSelect.value === 'system') {
        delete document.documentElement.dataset.theme;
        document.cookie = 'daymark-theme=; Max-Age=0; Path=/; SameSite=Lax';
      } else {
        document.documentElement.dataset.theme = themeSelect.value;
        document.cookie = `daymark-theme=${themeSelect.value}; Max-Age=31536000; Path=/; SameSite=Lax`;
      }
      updateThemeColor();
    });
    themeMedia.addEventListener('change', () => {
      if (!document.documentElement.dataset.theme) updateThemeColor();
    });
    updateThemeColor();

    function minutesFromMidnight(value) {
      const [hours, minutes] = value.split(':').map(Number);
      return hours * 60 + minutes;
    }

    function formatDuration(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return `${hours ? `${hours} hr` : ''}${hours && mins ? ' ' : ''}${mins ? `${mins} min` : ''}` || '0 min';
    }

    const calculatorViews = {
      'tracker-form': { value: 'hours', summary: 'summary', status: 'hours-status', label: 'Hours worked', unit: ' hours' },
      'stop-form': { value: 'stop-time', summary: 'stop-summary', status: 'stop-status', label: 'Stop time', unit: '' },
    };

    function validateInputs(form) {
      const inputs = [...form.querySelectorAll('input')];
      for (const input of inputs) {
        if (input.validity.valid) continue;
        let error;
        if (input.classList.contains('break-minutes')) {
          error = input.validity.valueMissing
            ? 'Enter break minutes; use 0 for no break.'
            : 'Enter whole break minutes between 0 and 1440.';
        } else if (input.id === 'desired-hours') {
          error = input.validity.valueMissing
            ? 'Enter desired hours.'
            : 'Enter 0.1 to 24 hours in tenths of an hour.';
        } else {
          error = `Enter a valid ${input.id.includes('start') ? 'start' : 'end'} time.`;
        }
        return { input, error };
      }
      return null;
    }

    function readBreaks(form) {
      const inputs = [...form.querySelectorAll('.break-minutes')];
      const total = inputs.reduce((sum, input) => sum + input.valueAsNumber, 0);
      if (!Number.isSafeInteger(total) || total > 24 * 60) {
        return { input: inputs.find(input => input.valueAsNumber > 0) || inputs[0], error: 'Total breaks cannot exceed 24 hours.' };
      }
      return { total, inputs };
    }

    function displayCalculation(form, result) {
      const view = calculatorViews[form.id];
      const value = document.getElementById(view.value);
      const summary = document.getElementById(view.summary);
      const error = form.querySelector('.error');
      if (error.textContent !== (result.error || '')) error.textContent = result.error || '';
      value.textContent = result.error ? '—' : result.value;
      summary.textContent = result.error ? '' : result.summary;
      value.closest('.result').dataset.state = result.error ? 'invalid' : 'valid';
      form.querySelectorAll('input').forEach(input => {
        if (result.error && input === result.input) {
          if (input.getAttribute('aria-invalid') !== 'true') input.setAttribute('aria-invalid', 'true');
          if (input.getAttribute('aria-describedby') !== error.id) input.setAttribute('aria-describedby', error.id);
        } else {
          input.removeAttribute('aria-invalid');
          input.removeAttribute('aria-describedby');
        }
      });
      return result;
    }

    function announceCalculation(form, result, prefix = '') {
      const view = calculatorViews[form.id];
      const message = result.error || `${view.label}: ${result.value}${view.unit}. ${result.summary}.`;
      const status = document.getElementById(view.status);
      const text = `${prefix}${message}`;
      if (status.textContent !== text) status.textContent = text;
    }

    function calculateHours() {
      const form = document.querySelector('#tracker-form');
      const problem = validateInputs(form);
      if (problem) return displayCalculation(form, problem);
      const breaks = readBreaks(form);
      if (breaks.error) return displayCalculation(form, breaks);

      const start = minutesFromMidnight(document.querySelector('#start').value);
      let end = minutesFromMidnight(document.querySelector('#end').value);
      if (end < start) end += 24 * 60;
      const shift = end - start;
      if (breaks.total > shift) {
        return displayCalculation(form, { input: breaks.inputs.find(input => input.valueAsNumber > 0), error: 'Break time cannot be longer than the shift.' });
      }

      return displayCalculation(form, {
        value: ((shift - breaks.total) / 60).toFixed(2),
        summary: `${formatDuration(shift)} shift · ${formatDuration(breaks.total)} in breaks`,
      });
    }

    function formatClockTime(totalMinutes) {
      const roundedMinutes = Math.round(totalMinutes);
      const dayOffset = Math.floor(roundedMinutes / (24 * 60));
      const minuteOfDay = ((roundedMinutes % (24 * 60)) + (24 * 60)) % (24 * 60);
      const hours24 = Math.floor(minuteOfDay / 60);
      const minutes = minuteOfDay % 60;
      const period = hours24 >= 12 ? 'PM' : 'AM';
      const hours12 = hours24 % 12 || 12;
      return { time: `${hours12}:${String(minutes).padStart(2, '0')} ${period}`, dayOffset };
    }

    function calculateStopTime() {
      const form = document.querySelector('#stop-form');
      const problem = validateInputs(form);
      if (problem) return displayCalculation(form, problem);
      const breaks = readBreaks(form);
      if (breaks.error) return displayCalculation(form, breaks);
      const desiredHours = document.querySelector('#desired-hours').valueAsNumber;
      const result = formatClockTime(minutesFromMidnight(document.querySelector('#stop-start').value) + desiredHours * 60 + breaks.total);
      const nextDay = result.dayOffset ? ` · ${result.dayOffset === 1 ? 'next day' : `${result.dayOffset} days later`}` : '';
      return displayCalculation(form, {
        value: result.time,
        summary: `${formatDuration(Math.round(desiredHours * 60))} goal · ${formatDuration(breaks.total)} in breaks${nextDay}`,
      });
    }

    let breakSequence = 0;

    function addBreak(container, calculate) {
      const row = document.createElement('div');
      const inputId = `${container.id}-break-${++breakSequence}`;
      const form = container.closest('form');
      row.className = 'break-row';
      row.innerHTML = `<div><label for="${inputId}">Optional break (minutes)</label><input class="break-minutes" id="${inputId}" type="number" min="0" max="1440" step="1" inputmode="numeric" value="0" required></div><button class="remove-break" type="button" aria-label="Remove optional break">×</button>`;
      row.querySelector('.remove-break').addEventListener('click', () => {
        const nextFocus = row.nextElementSibling?.querySelector('input') || row.previousElementSibling?.querySelector('input') || form.querySelector('.add-break');
        row.remove();
        const result = calculate();
        nextFocus.focus();
        announceCalculation(form, result, 'Break removed. ');
      });
      container.appendChild(row);
      row.querySelector('input').focus();
      announceCalculation(form, calculate(), 'Break added. ');
    }

    function bindCalculator(form, calculate) {
      form.addEventListener('input', () => {
        const status = document.getElementById(calculatorViews[form.id].status);
        if (status.textContent) status.textContent = '';
        calculate();
      });
      form.addEventListener('change', () => announceCalculation(form, calculate()));
      form.addEventListener('submit', event => {
        event.preventDefault();
        const result = calculate();
        if (result.error && result.input) result.input.focus();
        announceCalculation(form, result);
      });
    }

    const hoursForm = document.querySelector('#tracker-form');
    const stopForm = document.querySelector('#stop-form');
    document.querySelector('#add-break').addEventListener('click', () => addBreak(document.querySelector('#breaks'), calculateHours));
    document.querySelector('#add-stop-break').addEventListener('click', () => addBreak(document.querySelector('#stop-breaks'), calculateStopTime));
    bindCalculator(hoursForm, calculateHours);
    bindCalculator(stopForm, calculateStopTime);

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    function selectTab(tab) {
      tabs.forEach(item => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
        document.querySelector(`#${item.getAttribute('aria-controls')}`).hidden = !selected;
      });
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const nextTab = event.key === 'Home' ? tabs[0] : event.key === 'End' ? tabs[tabs.length - 1] : tabs[(index + direction + tabs.length) % tabs.length];
        selectTab(nextTab);
        nextTab.focus();
      });
    });

    calculateHours();
    calculateStopTime();
  </script>
</body>
</html>
