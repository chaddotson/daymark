<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daymark — Time Tracker</title>
  <style>
    :root {
      --ink: #17231e;
      --muted: #69746f;
      --paper: #f4f1e9;
      --card: #fffdf8;
      --line: #d8d5cb;
      --green: #28664a;
      --green-dark: #1d4b37;
      --mint: #dcecdf;
      --orange: #df7139;
      --shadow: 0 24px 60px rgba(25, 45, 35, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(223, 113, 57, .10), transparent 24rem),
        radial-gradient(circle at 88% 88%, rgba(40, 102, 74, .10), transparent 27rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell { width: min(860px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 40px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.03em; }
    .mark { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: white; }
    .mark::before { content: ""; width: 10px; height: 10px; border: 3px solid white; border-top-color: transparent; border-radius: 50%; transform: rotate(-30deg); }
    .today { color: var(--muted); font-size: .9rem; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 14px; padding: 4px; border: 1px solid rgba(23, 35, 30, .08); border-radius: 14px; background: rgba(255, 253, 248, .62); }
    .tab { min-height: 42px; border-radius: 10px; background: transparent; color: var(--muted); font-size: .88rem; font-weight: 800; transition: color .18s, background .18s, box-shadow .18s; }
    .tab[aria-selected="true"] { color: var(--ink); background: var(--card); box-shadow: 0 4px 14px rgba(25, 45, 35, .09); }
    .tab:focus-visible { outline: 3px solid rgba(40, 102, 74, .22); outline-offset: 2px; }
    .tab-panel[hidden] { display: none; }

    main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(240px, .7fr); gap: 18px; align-items: stretch; }
    .card { background: var(--card); border: 1px solid rgba(23, 35, 30, .08); border-radius: 24px; box-shadow: var(--shadow); }
    .entry { padding: clamp(24px, 4vw, 34px); }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 500; letter-spacing: -.045em; line-height: 1; }
    .intro { margin: 8px 0 24px; color: var(--muted); font-size: .94rem; }

    .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: block; margin: 0 0 7px; color: var(--muted); font-size: .78rem; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
    input[type="time"], input[type="number"] { width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 12px; background: white; padding: 0 14px; color: var(--ink); font: inherit; font-size: 1rem; outline: none; transition: border-color .18s, box-shadow .18s; }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(40, 102, 74, .12); }

    .divider { height: 1px; margin: 20px 0; background: var(--line); }
    .break-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; font-weight: 600; }
    .break-row { display: grid; grid-template-columns: 1fr 42px; align-items: end; gap: 8px; margin-top: 10px; }
    button { border: 0; font: inherit; cursor: pointer; }
    .add-break { padding: 0; color: var(--green); background: transparent; font-size: .85rem; font-weight: 750; }
    .remove-break { height: 50px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--muted); font-size: 1.25rem; }
    .remove-break:hover { color: #9f352d; border-color: #d7aaa5; }
    .calculate { width: 100%; margin-top: 18px; min-height: 50px; border-radius: 14px; background: var(--green); color: white; font-weight: 800; box-shadow: 0 10px 25px rgba(40, 102, 74, .2); transition: background .18s, transform .18s; }
    .calculate:hover { background: var(--green-dark); transform: translateY(-1px); }

    .result { padding: 28px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; background: var(--green); color: white; }
    .result > div:first-child { min-width: 0; }
    .result::after { content: ""; position: absolute; width: 210px; height: 210px; right: -100px; bottom: -90px; border: 36px solid rgba(255,255,255,.07); border-radius: 50%; }
    .result-label { color: rgba(255,255,255,.72); font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .result-value { margin: 24px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(4rem, 10vw, 6rem); line-height: .85; letter-spacing: -.06em; }
    .result-value.clock-value { font-size: clamp(4.0rem, 4vw, 3.25rem); letter-spacing: -.075em; white-space: nowrap; }
    .result-unit { margin: 12px 0 0 5px; color: var(--mint); font-size: .95rem; }
    .summary { position: relative; z-index: 1; margin-top: 44px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.22); color: rgba(255,255,255,.78); font-size: .9rem; line-height: 1.55; }
    .error { min-height: 22px; margin: 12px 0 -10px; color: #a8392f; font-size: .88rem; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 20px, 560px); padding: 10px 0 16px; }
      header { margin-bottom: 10px; }
      .tabs { margin-bottom: 10px; }
      .tab { min-height: 40px; font-size: .8rem; }
      .mark { width: 32px; height: 32px; }
      .brand { gap: 9px; }
      .today { font-size: .78rem; }
      main { grid-template-columns: 1fr; gap: 10px; }
      .card { border-radius: 18px; box-shadow: 0 12px 32px rgba(25, 45, 35, .1); }
      .entry { padding: 18px; }
      h1 { font-size: 1.75rem; }
      .intro { margin: 4px 0 16px; font-size: .82rem; }
      label { margin-bottom: 5px; font-size: .69rem; }
      input[type="time"], input[type="number"] { min-height: 44px; padding: 0 10px; }
      .divider { margin: 14px 0; }
      .break-heading { margin-bottom: 6px; }
      h2 { font-size: 1.08rem; }
      .break-row { grid-template-columns: 1fr 40px; margin-top: 7px; }
      .remove-break { height: 44px; }
      .error { min-height: 17px; margin: 6px 0 -6px; font-size: .78rem; }
      .calculate { min-height: 46px; margin-top: 12px; }
      .result { min-height: 112px; padding: 17px 20px; flex-direction: row; align-items: center; gap: 16px; }
      .result > div:first-child { flex: 1 1 auto; min-width: 0; }
      .result-value { display: inline; margin: 0; font-size: 3.4rem; }
      .result-value.clock-value { display: block; font-size: clamp(2rem, 10.5vw, 2.75rem); letter-spacing: -.075em; }
      .result-unit { display: inline; margin: 0 0 0 7px; font-size: .78rem; }
      .summary { flex: 0 1 145px; min-width: 0; margin: 0; padding: 0 0 0 16px; border-top: 0; border-left: 1px solid rgba(255,255,255,.22); max-width: 145px; overflow-wrap: anywhere; font-size: .78rem; }
    }

    @media (max-width: 380px) {
      .today { display: none; }
      .entry { padding: 15px; }
      .result { min-height: 102px; padding: 14px 17px; gap: 10px; }
      .result-value { font-size: 3rem; }
      .result-value.clock-value { font-size: clamp(1.9rem, 10.5vw, 2.35rem); }
      .summary { flex-basis: 128px; padding-left: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"></span> Daymark</div>
      <div class="today" id="today"></div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Time calculators">
      <button class="tab" id="hours-tab" type="button" role="tab" aria-selected="true" aria-controls="hours-panel">Hours worked</button>
      <button class="tab" id="stop-tab" type="button" role="tab" aria-selected="false" aria-controls="stop-panel" tabindex="-1">Stop time</button>
    </nav>

    <main class="tab-panel" id="hours-panel" role="tabpanel" aria-labelledby="hours-tab">
      <section class="card entry">
        <h1>Today’s hours</h1>
        <p class="intro">Enter your shift and breaks.</p>

        <form id="tracker-form">
          <div class="time-grid">
            <div><label for="start">Start time</label><input id="start" type="time" value="08:00" required></div>
            <div><label for="end">End time</label><input id="end" type="time" value="17:00" required></div>
          </div>

          <div class="divider"></div>
          <div class="break-heading">
            <h2>Breaks</h2>
            <button class="add-break" type="button" id="add-break">+ Add break</button>
          </div>
          <div id="breaks">
            <div class="break-row">
              <div><label for="lunch">Lunch (minutes)</label><input class="break-minutes" id="lunch" type="number" min="0" step="1" value="30" required></div>
              <span aria-hidden="true"></span>
            </div>
          </div>
          <p class="error" id="error" role="alert"></p>
          <button class="calculate" type="submit">Calculate hours</button>
        </form>
      </section>

      <aside class="card result" aria-live="polite">
        <div>
          <div class="result-label">Hours worked</div>
          <div class="result-value" id="hours">8.50</div>
          <div class="result-unit">decimal hours</div>
        </div>
        <div class="summary" id="summary">9 hr shift · 30 min in breaks</div>
      </aside>
    </main>

    <main class="tab-panel" id="stop-panel" role="tabpanel" aria-labelledby="stop-tab" hidden>
      <section class="card entry">
        <h1>Clock-out time</h1>
        <p class="intro">See when you’ll hit your goal.</p>

        <form id="stop-form">
          <div class="time-grid">
            <div><label for="stop-start">Start time</label><input id="stop-start" type="time" value="08:00" required></div>
            <div><label for="desired-hours">Desired hours</label><input id="desired-hours" type="number" min="0.01" max="24" step="0.25" value="8" required></div>
          </div>

          <div class="divider"></div>
          <div class="break-heading">
            <h2>Breaks</h2>
            <button class="add-break" type="button" id="add-stop-break">+ Add break</button>
          </div>
          <div id="stop-breaks">
            <div class="break-row">
              <div><label for="stop-lunch">Lunch (minutes)</label><input class="break-minutes" id="stop-lunch" type="number" min="0" step="1" value="30" required></div>
              <span aria-hidden="true"></span>
            </div>
          </div>
          <p class="error" id="stop-error" role="alert"></p>
          <button class="calculate" type="submit">Calculate stop time</button>
        </form>
      </section>

      <aside class="card result" aria-live="polite">
        <div>
          <div class="result-label">Stop time</div>
          <div class="result-value clock-value" id="stop-time">4:30 PM</div>
        </div>
        <div class="summary" id="stop-summary">8 hr goal · 30 min in breaks</div>
      </aside>
    </main>
  </div>

  <script>
    document.querySelector('#today').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());

    function minutesFromMidnight(value) {
      const [hours, minutes] = value.split(':').map(Number);
      return hours * 60 + minutes;
    }

    function formatDuration(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return `${hours ? `${hours} hr` : ''}${hours && mins ? ' ' : ''}${mins ? `${mins} min` : ''}` || '0 min';
    }

    function getBreakMinutes(form) {
      return [...form.querySelectorAll('.break-minutes')].map(input => Number(input.value));
    }

    function calculateHours(event) {
      event?.preventDefault();
      const form = document.querySelector('#tracker-form');
      const error = document.querySelector('#error');
      error.textContent = '';
      const startValue = document.querySelector('#start').value;
      const endValue = document.querySelector('#end').value;
      if (!startValue || !endValue) return;

      const start = minutesFromMidnight(startValue);
      let end = minutesFromMidnight(endValue);
      if (end < start) end += 24 * 60;
      const shift = end - start;
      const breakValues = getBreakMinutes(form);
      if (breakValues.some(value => !Number.isFinite(value) || value < 0)) {
        error.textContent = 'Enter a valid number of minutes for every break.';
        return;
      }
      const totalBreak = breakValues.reduce((sum, value) => sum + value, 0);
      if (totalBreak > shift) {
        error.textContent = 'Break time cannot be longer than the shift.';
        return;
      }

      document.querySelector('#hours').textContent = ((shift - totalBreak) / 60).toFixed(2);
      document.querySelector('#summary').textContent = `${formatDuration(shift)} shift · ${formatDuration(totalBreak)} in breaks`;
    }

    function formatClockTime(totalMinutes) {
      const roundedMinutes = Math.round(totalMinutes);
      const dayOffset = Math.floor(roundedMinutes / (24 * 60));
      const minuteOfDay = ((roundedMinutes % (24 * 60)) + (24 * 60)) % (24 * 60);
      const hours24 = Math.floor(minuteOfDay / 60);
      const minutes = minuteOfDay % 60;
      const period = hours24 >= 12 ? 'PM' : 'AM';
      const hours12 = hours24 % 12 || 12;
      return { time: `${hours12}:${String(minutes).padStart(2, '0')} ${period}`, dayOffset };
    }

    function calculateStopTime(event) {
      event?.preventDefault();
      const form = document.querySelector('#stop-form');
      const error = document.querySelector('#stop-error');
      error.textContent = '';
      const startValue = document.querySelector('#stop-start').value;
      const desiredHours = Number(document.querySelector('#desired-hours').value);
      const breakValues = getBreakMinutes(form);

      if (!startValue) return;
      if (!Number.isFinite(desiredHours) || desiredHours <= 0 || desiredHours > 24) {
        error.textContent = 'Enter desired hours between 0 and 24.';
        return;
      }
      if (breakValues.some(value => !Number.isFinite(value) || value < 0)) {
        error.textContent = 'Enter a valid number of minutes for every break.';
        return;
      }

      const totalBreak = breakValues.reduce((sum, value) => sum + value, 0);
      const result = formatClockTime(minutesFromMidnight(startValue) + desiredHours * 60 + totalBreak);
      document.querySelector('#stop-time').textContent = result.time;
      const nextDay = result.dayOffset ? ` · ${result.dayOffset === 1 ? 'next day' : `${result.dayOffset} days later`}` : '';
      document.querySelector('#stop-summary').textContent = `${formatDuration(Math.round(desiredHours * 60))} goal · ${formatDuration(totalBreak)} in breaks${nextDay}`;
    }

    function addBreak(container, calculate) {
      const row = document.createElement('div');
      row.className = 'break-row';
      row.innerHTML = `<div><label>Optional break (minutes)</label><input class="break-minutes" type="number" min="0" step="1" value="0" required></div><button class="remove-break" type="button" aria-label="Remove break">×</button>`;
      row.querySelector('.remove-break').addEventListener('click', () => { row.remove(); calculate(); });
      container.appendChild(row);
      row.querySelector('input').focus();
    }

    const hoursForm = document.querySelector('#tracker-form');
    const stopForm = document.querySelector('#stop-form');
    document.querySelector('#add-break').addEventListener('click', () => addBreak(document.querySelector('#breaks'), calculateHours));
    document.querySelector('#add-stop-break').addEventListener('click', () => addBreak(document.querySelector('#stop-breaks'), calculateStopTime));
    hoursForm.addEventListener('submit', calculateHours);
    hoursForm.addEventListener('input', calculateHours);
    stopForm.addEventListener('submit', calculateStopTime);
    stopForm.addEventListener('input', calculateStopTime);

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    function selectTab(tab) {
      tabs.forEach(item => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
        document.querySelector(`#${item.getAttribute('aria-controls')}`).hidden = !selected;
      });
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const nextTab = tabs[(index + direction + tabs.length) % tabs.length];
        selectTab(nextTab);
        nextTab.focus();
      });
    });

    calculateHours();
    calculateStopTime();
  </script>
</body>
</html>
